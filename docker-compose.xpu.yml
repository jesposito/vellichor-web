services:
  vellichor-web:
    build:
      context: .
      dockerfile: Dockerfile.xpu
    image: vellichor-web:xpu
    container_name: vellichor-web
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "7777:7777"
    environment:
      # Auth (set in .env)
      VELLICHOR_PASSWORD: "${VELLICHOR_PASSWORD}"
      SECRET_KEY: "${SECRET_KEY}"
      # Own exported audiobooks as the Audiobookshelf user so ABS can read them
      ABS_UID: "911"
      ABS_GID: "911"
      # Optional: push a notification when a conversion finishes
      # (e.g. ntfy at http://<server-ip>:8087/<topic>, gotify at :8070)
      NOTIFY_URL: "${NOTIFY_URL:-}"
      # AI "Smart cast" — local Ollama model for speaker attribution. Ollama
      # has no mainline Intel Arc backend, so this build runs it CPU-only
      # (llama3.2:3b is small enough that this is tolerable for occasional
      # use). Point OLLAMA_URL at an existing GPU-backed Ollama/ipex-llm
      # endpoint instead if you have one, and drop the bundled `ollama`
      # service below.
      OLLAMA_URL: "http://ollama:11434"
      SMARTCAST_MODEL: "${SMARTCAST_MODEL:-llama3.2:3b}"
    volumes:
      - ./data:/data
      - /mnt/user/eMedia/eMedia/Audiobooks:/library
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: vellichor-ollama
    restart: unless-stopped
    environment:
      # Unload the model after use; keeps the CPU-only container's RAM down
      # between Smart-cast requests.
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - ./data/ollama:/root/.ollama
